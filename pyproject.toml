[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "curbstone"
version = "0.1.0"
description = "Detect likely fabricated survey interviews at the enumerator level using synthetic data with known ground truth."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "duckdb",
    "scipy",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*", "generator*", "eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
markers = [
    "slow: marks tests as slow (deselected by default with addopts = -m 'not slow')",
]
addopts = "-m 'not slow'"

